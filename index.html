
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GOV.UK - Bağımlı İl İlçe Testi</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/accessible-autocomplete@3.0.1/dist/accessible-autocomplete.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 15px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .autocomplete__wrapper {
      width: 100%;
    }

    #result {
      background: #eef5ff;
      padding: 15px;
      border-radius: 6px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/accessible-autocomplete@3.0.1/dist/accessible-autocomplete.min.js"></script>
</head>

<body>

  <h1>GOV.UK İl / İlçe VoiceOver Testi</h1>

  <p>
    GOV.UK resmî showAllValues yaklaşımı.
    İl ve ilçe alanları bağımlıdır.
  </p>

  <div class="field">
    <label for="city">İl seçiniz</label>
    <div id="city-container"></div>
  </div>

  <div class="field">
    <label for="district">İlçe seçiniz</label>
    <div id="district-container"></div>
  </div>

  <p id="result" role="status" aria-live="polite">
    Henüz seçim yapılmadı.
  </p>

  <p id="state"></p>

  <script>
    const DATA = [
      {
        label: "Adana",
        districts: ["Çukurova", "Seyhan", "Yüreğir"]
      },
      {
        label: "Ankara",
        districts: [
          "Çankaya",
          "Keçiören",
          "Mamak",
          "Yenimahalle"
        ]
      },
      {
        label: "İstanbul",
        districts: [
          "Beşiktaş",
          "Kadıköy",
          "Şişli",
          "Üsküdar"
        ]
      },
      {
        label: "İzmir",
        districts: [
          "Bornova",
          "Buca",
          "Karşıyaka",
          "Konak"
        ]
      },
      {
        label: "Konya",
        districts: [
          "Karatay",
          "Meram",
          "Selçuklu"
        ]
      }
    ];

    let selectedCity = "";
    let selectedDistrict = "";

    const result = document.getElementById("result");
    const state = document.getElementById("state");

    function normalize(text) {
      return String(text || "")
        .toLocaleLowerCase("tr-TR");
    }

    function getDistricts() {
      const city = DATA.find(
        item => item.label === selectedCity
      );

      return city ? city.districts : [];
    }

    function updateResult() {
      result.textContent = selectedCity
        ? "Seçilen il: " + selectedCity +
          " | İlçe: " + (selectedDistrict || "Seçilmedi")
        : "Henüz seçim yapılmadı.";
    }

    try {
      if (typeof accessibleAutocomplete !== "function") {
        throw new Error("GOV.UK kütüphanesi yüklenemedi.");
      }

      // İL: Resmî showAllValues örneğine yakın yapı
      accessibleAutocomplete({
        element: document.querySelector("#city-container"),
        id: "city",
        source: DATA.map(item => item.label),
        showAllValues: true,
        minLength: 0,
        autoselect: false,
        confirmOnBlur: false,

        onConfirm: function(value) {
          const found = DATA.find(
            item => item.label === value
          );

          const newCity = found ? found.label : "";

          if (newCity !== selectedCity) {
            selectedCity = newCity;
            selectedDistrict = "";

            // İlçe bileşenini silmeden alanı temizle.
            const districtInput =
              document.getElementById("district");

            if (districtInput) {
              districtInput.value = "";
              districtInput.dispatchEvent(
                new Event("input", { bubbles: true })
              );
            }
          }

          updateResult();
        }
      });

      // İLÇE: Tek kez oluşturuluyor.
      // Sonuçlar seçili ile göre hesaplanıyor.
      accessibleAutocomplete({
        element: document.querySelector("#district-container"),
        id: "district",
        showAllValues: true,
        minLength: 0,
        autoselect: false,
        confirmOnBlur: false,

        source: function(query, populateResults) {
          const districts = getDistricts();

          const filtered = districts.filter(
            item => normalize(item).includes(normalize(query))
          );

          populateResults(filtered);
        },

        onConfirm: function(value) {
          selectedDistrict = getDistricts().includes(value)
            ? value
            : "";

          updateResult();
        }
      });

      state.textContent = "İki ComboBox oluşturuldu.";

    } catch (error) {
      state.textContent = "Hata: " + error.message;
      console.error(error);
    }
  </script>

</body>
</html>
