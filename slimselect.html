<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slim Select | İl İlçe Testi</title><link href="https://unpkg.com/slim-select@2.9.2/styles" rel="stylesheet"><style>body{font:16px/1.6 system-ui;max-width:650px;margin:35px auto;padding:0 18px;color:#172033}label{display:block;font-weight:700;margin:20px 0 8px}select{width:100%;min-height:42px}a{color:#174ea6}#durum{margin-top:20px;padding:12px;background:#f0f5fa;border-radius:8px}</style></head><body><main><p><a href="index.html">← Test ana sayfası</a></p><h1>Slim Select – İl / İlçe</h1><p>Arama, il–ilçe bağımlılığı ve iPhone VoiceOver seçenek okuma testi.</p><label for="il">İl seçiniz</label><select id="il"><option value="">İl seçiniz</option><option value="ankara">Ankara</option><option value="istanbul">İstanbul</option><option value="izmir">İzmir</option></select><label for="ilce">İlçe seçiniz</label><select id="ilce" disabled><option value="">Önce il seçiniz</option></select><p id="durum" role="status" aria-live="polite">Henüz il seçilmedi.</p></main><script src="https://unpkg.com/slim-select@2.9.2/slimselect.umd.js"></script><script>
const data={ankara:['Çankaya','Keçiören','Yenimahalle','Etimesgut','Mamak'],istanbul:['Kadıköy','Beşiktaş','Şişli','Üsküdar','Fatih'],izmir:['Konak','Karşıyaka','Bornova','Buca','Balçova']};
const cityEl=document.getElementById('il'),districtEl=document.getElementById('ilce'),statusEl=document.getElementById('durum');
const city=new SlimSelect({select:'#il',settings:{searchPlaceholder:'İl ara',searchText:'Sonuç bulunamadı',placeholderText:'İl seçiniz',showSearch:true}});
const district=new SlimSelect({select:'#ilce',settings:{searchPlaceholder:'İlçe ara',searchText:'Sonuç bulunamadı',placeholderText:'İlçe seçiniz',showSearch:true}});
function refreshDistricts(){const value=cityEl.value;const districts=data[value]||[];district.setData([{text:value?'İlçe seçiniz':'Önce il seçiniz',value:'',placeholder:true},...districts.map(d=>({text:d,value:d}))]);if(value)district.enable();else district.disable();statusEl.textContent=value?cityEl.options[cityEl.selectedIndex].text+' seçildi. İlçe seçimini yeniden yapınız.':'İl seçimi temizlendi.';}
cityEl.addEventListener('change',refreshDistricts);districtEl.addEventListener('change',()=>{if(districtEl.value)statusEl.textContent='Seçim: '+cityEl.options[cityEl.selectedIndex].text+' / '+districtEl.value;});
</script></body></html>
