<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slim Select – İl / İlçe VoiceOver Testi</title>
<link rel="stylesheet" href="https://unpkg.com/slim-select@2.9.2/styles">
<style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,-apple-system,Arial,sans-serif;max-width:680px;margin:24px auto;padding:0 16px 60px;color:#172b43;background:#f4f6fa}section{background:white;border:1px solid #d9e2ed;border-radius:12px;padding:20px}.field{position:relative;margin:20px 0}label{display:block;font-weight:650;margin-bottom:8px}select{width:100%;min-height:44px;font:inherit}#result{background:#edf5ff;padding:12px;border-radius:6px}#state{color:#46566c}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}</style>
<script src="https://unpkg.com/slim-select@2.9.2/slimselect.umd.js"></script>
</head><body><main><p><a href="index.html">← Test ana sayfası</a></p><h1>Slim Select – İl / İlçe</h1><p>VoiceOver sağa kaydırma ve bağımlı seçim testi.</p><section>
<label><input id="nativeMode" type="checkbox"> Karşılaştırma için standart HTML select kullan</label>
<div class="field" id="cityField"><label for="city">İl seçiniz</label><select id="city"><option value="">İl seçiniz</option><option value="ankara">Ankara</option><option value="istanbul">İstanbul</option><option value="izmir">İzmir</option></select></div>
<div class="field" id="districtField"><label for="district">İlçe seçiniz</label><select id="district" disabled><option value="">Önce il seçiniz</option></select></div>
<p id="result" role="status" aria-live="polite">Henüz il seçilmedi.</p><p id="state"></p></section>
<p>Test: Ankara → Çankaya, sonra İstanbul → Şişli. Listeyi açtıktan sonra VoiceOver ile sağa kaydır. Standart select modunu da dene.</p></main>
<script>
(()=>{'use strict';
const DATA={ankara:['Çankaya','Keçiören','Mamak','Yenimahalle'],istanbul:['Beşiktaş','Kadıköy','Şişli','Üsküdar'],izmir:['Bornova','Buca','Karşıyaka','Konak']};
const cityEl=document.getElementById('city'),districtEl=document.getElementById('district'),result=document.getElementById('result'),state=document.getElementById('state'),nativeMode=document.getElementById('nativeMode');
let city=null,district=null;
function updateResult(){result.textContent=cityEl.value?'Seçilen il: '+(cityEl.selectedOptions[0]?.textContent||cityEl.value)+' · İlçe: '+(districtEl.value||'Henüz seçilmedi'):'Henüz il seçilmedi.'}
function refreshDistricts(){const items=DATA[cityEl.value]||[];if(nativeMode.checked){districtEl.replaceChildren(new Option(cityEl.value?'İlçe seçiniz':'Önce il seçiniz',''),...items.map(d=>new Option(d,d)));districtEl.value='';districtEl.disabled=!cityEl.value}else{district.setData([{text:cityEl.value?'İlçe seçiniz':'Önce il seçiniz',value:'',placeholder:true},...items.map(d=>({text:d,value:d}))]);if(cityEl.value){district.enable()}else{district.disable()}}updateResult()}
function createSlim(){city=new SlimSelect({select:'#city',settings:{searchPlaceholder:'İl ara',searchText:'Sonuç bulunamadı',placeholderText:'İl seçiniz',showSearch:true,contentLocation:document.getElementById('cityField')},events:{afterChange:()=>refreshDistricts()}});district=new SlimSelect({select:'#district',settings:{searchPlaceholder:'İlçe ara',searchText:'Sonuç bulunamadı',placeholderText:'İlçe seçiniz',showSearch:true,contentLocation:document.getElementById('districtField')},events:{afterChange:()=>updateResult()}});refreshDistricts()}
try{if(typeof SlimSelect!=='function')throw Error('Slim Select yüklenemedi. CDN bağlantısını kontrol edin.');createSlim();cityEl.addEventListener('change',()=>{if(nativeMode.checked)refreshDistricts()});districtEl.addEventListener('change',()=>{if(nativeMode.checked)updateResult()});nativeMode.addEventListener('change',()=>{if(nativeMode.checked){city.destroy();district.destroy();city=null;district=null;refreshDistricts();state.textContent='Standart HTML select modu.'}else{createSlim();state.textContent='Slim Select modu. VoiceOver sonucu cihazda doğrulanmalı.'}});state.textContent='Slim Select hazır. VoiceOver sonucu cihazda doğrulanmalı.'}catch(e){state.textContent='Hata: '+e.message;console.error(e)}
})();
</script></body></html>
