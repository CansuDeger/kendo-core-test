
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kendo UI Core - VoiceOver Testi</title>

  <link rel="stylesheet"
    href="https://kendo.cdn.telerik.com/themes/13.0.0/default/default-ocean-blue.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://kendo.cdn.telerik.com/2026.1.212/js/kendo.ui.core.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.5;
    }

    .field {
      margin: 24px 0;
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
    }

    #result {
      background: #edf5ff;
      padding: 12px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Kendo UI Core - VoiceOver Testi</h1>

    <p>
      Bu testte il ve ilçe alanları birbirinden bağımsızdır.
    </p>

    <div class="field" id="city-container">
      <label for="city">İl seçiniz</label>
      <input id="city" autocomplete="off">
    </div>

    <div class="field" id="district-container">
      <label for="district">İlçe seçiniz</label>
      <input id="district" autocomplete="off">
    </div>

    <p id="result" role="status" aria-live="polite">
      Henüz seçim .
    </p>

    <p id="load-status">Yükleniyor…</p>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const result = document.getElementById("result");
      const loadStatus = document.getElementById("load-status");

      if (!window.jQuery ||
          typeof jQuery.fn.kendoComboBox !== "function") {
        loadStatus.textContent = "Kendo UI Core yüklenemedi.";
        return;
      }

      try {
        $("#city").kendoComboBox({
          dataTextField: "text",
          dataValueField: "value",
          filter: "contains",
          suggest: true,
          placeholder: "İl ara veya seç",

          popup: {
            appendTo: $("#city-container")
          },

          dataSource: [
            { text: "Adana", value: "01" },
            { text: "Adıyaman", value: "02" },
            { text: "Ankara", value: "06" },
            { text: "İstanbul", value: "34" },
            { text: "Konya", value: "42" }
          ],

          change: updateResult
        });

        $("#district").kendoComboBox({
          dataTextField: "text",
          dataValueField: "value",
          filter: "contains",
          suggest: true,
          placeholder: "İlçe ara veya seç",

          popup: {
            appendTo: $("#district-container")
          },

          dataSource: [
            { text: "Çankaya", value: "cankaya" },
            { text: "Keçiören", value: "kecioren" },
            { text: "Kadıköy", value: "kadikoy" },
            { text: "Şişli", value: "sisli" },
            { text: "Selçuklu", value: "selcuklu" }
          ],

          change: updateResult
        });

        function updateResult() {
          const city = $("#city").data("kendoComboBox");
          const district = $("#district").data("kendoComboBox");

          result.textContent =
            "Seçilen il: " + (city.text() || "Yok") +
            " | Seçilen ilçe: " + (district.text() || "Yok");
        }

        loadStatus.textContent =
          "Her iki ComboBox hazır.";

      } catch (error) {
        loadStatus.textContent =
          "Başlatma hatası: " + error.message;

        console.error(error);
      }
    });
  </script>
</body>
</html>
