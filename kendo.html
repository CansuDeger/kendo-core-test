<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kendo UI Core - İki Bağımsız ComboBox VoiceOver Testi</title>
  <link rel="stylesheet" href="https://kendo.cdn.telerik.com/themes/13.0.0/default/default-ocean-blue.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://kendo.cdn.telerik.com/2026.1.212/js/kendo.ui.core.min.js"></script>
</head>
<body style="font-family:Arial,sans-serif;padding:24px;max-width:650px;margin:auto">
  <h1>Kendo UI Core VoiceOver Testi</h1>
  <p>Bu testte il ve ilçe alanları birbirinden bağımsızdır. İl seçimi ilçeleri değiştirmez.</p>

  <div style="margin-bottom:24px">
    <label for="city" style="display:block;margin-bottom:8px">İl seçiniz</label>
    <input id="city" style="width:100%">
  </div>

  <div style="margin-bottom:24px">
    <label for="district" style="display:block;margin-bottom:8px">İlçe seçiniz</label>
    <input id="district" style="width:100%">
  </div>

  <p id="result" role="status" aria-live="polite">Henüz seçim yapılmadı.</p>
  <p id="load-status">Yükleniyor…</p>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const result = document.getElementById("result");
      const loadStatus = document.getElementById("load-status");

      if (!window.jQuery) {
        loadStatus.textContent = "Hata: jQuery yüklenemedi.";
        return;
      }
      if (typeof jQuery.fn.kendoComboBox !== "function") {
        loadStatus.textContent = "Hata: Kendo UI Core ComboBox yüklenemedi.";
        return;
      }

      try {
        // İlk çalışan örnekteki yapılandırma aynen korunuyor.
        jQuery("#city").kendoComboBox({
          dataTextField: "text",
          dataValueField: "value",
          filter: "contains",
          suggest: true,
          placeholder: "İl ara veya seç",
          dataSource: [
            { text: "Adana", value: "01" },
            { text: "Adıyaman", value: "02" },
            { text: "Ankara", value: "06" },
            { text: "İstanbul", value: "34" },
            { text: "Konya", value: "42" }
          ],
          change: updateResult
        });

        // Tek fark: ikinci, bağımsız bir ComboBox ekleniyor.
        jQuery("#district").kendoComboBox({
          dataTextField: "text",
          dataValueField: "value",
          filter: "contains",
          suggest: true,
          placeholder: "İlçe ara veya seç",
          dataSource: [
            { text: "Çankaya", value: "cankaya" },
            { text: "Keçiören", value: "kecioren" },
            { text: "Kadıköy", value: "kadikoy" },
            { text: "Şişli", value: "sisli" },
            { text: "Selçuklu", value: "selcuklu" }
          ],
          change: updateResult
        });

        function updateResult() {
          const city = jQuery("#city").data("kendoComboBox");
          const district = jQuery("#district").data("kendoComboBox");
          result.textContent = "Seçilen il: " + (city.text() || "Yok") +
            " | Seçilen ilçe: " + (district.text() || "Yok");
        }

        loadStatus.textContent = "Her iki ComboBox hazır.";
        console.log("İki bağımsız Kendo UI Core ComboBox oluşturuldu.");
      } catch (error) {
        loadStatus.textContent = "Başlatma hatası: " + error.message;
        console.error(error);
      }
    });
  </script>
</body>
</html>
